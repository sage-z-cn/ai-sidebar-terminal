<div id="toolbar" class="toolbar">
  <div class="toolbar-context">
    <div class="pill-host" id="pill-ai-tool">
      <button type="button" class="toolbar-pill" id="btn-pill-ai-tool" aria-haspopup="listbox" aria-label="Select AI tool">
        <span class="pill-label" id="pill-ai-tool-label">OpenCode</span>
        <svg class="pill-chevron" width="8" height="5" viewBox="0 0 8 5" fill="none" aria-hidden="true"><path d="M1 1l3 3 3-3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="pill-dropdown hidden" id="dropdown-ai-tool" role="listbox"></div>
    </div>
  </div>
  <div class="toolbar-controls">
  </div>
  <div class="toolbar-right">
    <button
      type="button"
      id="btn-restart"
      class="toolbar-btn"
      aria-label="Restart terminal"
      title="{{t:restart}}"
    >
      &#x21BB;
    </button>
    <div class="font-size-host">
      <button
        type="button"
        id="btn-font-increase"
        class="toolbar-btn"
        aria-label="Increase font size"
        title="{{t:fontIncrease}}"
      >
        A+
      </button>
      <div class="font-size-tooltip hidden" id="font-size-tooltip" role="status" aria-live="polite"></div>
      <button
        type="button"
        id="btn-font-decrease"
        class="toolbar-btn"
        aria-label="Decrease font size"
        title="{{t:fontDecrease}}"
      >
        A&#x2212;
      </button>
    </div>
    <button
      type="button"
      id="btn-keymap"
      class="toolbar-btn hidden"
      aria-label="{{t:keymap}}"
      title="{{t:keymap}}"
    >
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="1.5" y="3.5" width="13" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
        <path d="M4 6.5h1.2M6.8 6.5H8M9.2 6.5H10.4M11.2 6.5H12.5M4 9.5h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="settings-host">
      <button
        type="button"
        id="btn-settings"
        class="toolbar-btn"
        aria-label="Open extension settings"
        title="{{t:settings}}"
      >
        &#x2699;
      </button>
      <div class="settings-dropdown hidden" id="dropdown-settings" role="menu">
        <div class="settings-option" role="menuitem" data-action="resetFontSize">
          &#x1F504;&#xFE0E; {{t:fontReset}}
        </div>
        <div class="settings-option" role="menuitem" data-action="toggleEditor">
          <span id="settings-toggle-editor-icon">&#x2197;&#xFE0E;</span>
          <span id="settings-toggle-editor-label">{{t:toggleEditor}}</span>
        </div>
        <div class="settings-option" role="menuitem" data-action="keyboardShortcuts">
          &#x2328;&#xFE0E; {{t:keybindSettings}}
        </div>
        <div class="settings-option" role="menuitem" data-action="settings">
          &#x2699;&#xFE0E; {{t:extensionSettings}}
        </div>
      </div>
    </div>
  </div>
</div>
